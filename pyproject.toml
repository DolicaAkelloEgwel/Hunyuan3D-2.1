[project]
name = "hunyuan3d-2-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "py-cpuinfo>=9.0.0",
    "torch>=2.9.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
environments = [
    "sys_platform == 'linux'",
]

[tool.uv.extra-build-dependencies]
deepspeed = ["torch", "py-cpuinfo"]
